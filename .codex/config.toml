[mcp_servers.godot-mcp-toolkit]
command = "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
args = ["-NoProfile", "-ExecutionPolicy", "RemoteSigned", "-File", "F:\\GodotProjects\\GodotTools\\editor_launcher\\launch.ps1", "-Project", "godot_party", "-Mode", "McpServer"]
startup_timeout_sec = 20
tool_timeout_sec = 120
required = false
default_tools_approval_mode = "auto"


# Keep potentially verbose structured reads bounded. Prefer targeted scene,
# console, and diagnostic queries before raising these limits.
[mcp_servers.godot-mcp-toolkit.tools.scene_get_tree]
output_token_limit = 6000

[mcp_servers.godot-mcp-toolkit.tools.editor_get_console]
output_token_limit = 8000

[mcp_servers.godot-mcp-toolkit.tools.debugger_get_log]
output_token_limit = 8000

[mcp_servers.godot-mcp-toolkit.tools.lsp_project_diagnostics]
output_token_limit = 12000
