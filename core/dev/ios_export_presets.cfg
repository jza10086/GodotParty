application/bundle_identifier="org.godotparty.play"
application/short_version="5.0.0"
application/version="1"
application/targeted_device_family=2
application/min_ios_version="15.0"
application/additional_plist_content="<key>NSLocalNetworkUsageDescription</key><string>用于创建和加入局域网多人游戏房间。</string><key>NSMicrophoneUsageDescription</key><string>在你启用语音时用于游戏内语音交流。</string><key>UIRequiresFullScreen</key><true/>"
entitlements/game_center=false
capabilities/access_wifi=false
icons/icon_1024x1024="res://icon.svg"
